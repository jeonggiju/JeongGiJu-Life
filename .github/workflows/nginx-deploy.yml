name: Deploy Nginx to Ec2
on:
  push:
    branches:
      - production
    paths:
      - "nginx/**"
      - "deploy/nginx/**"
      - ".github/workflows/nginx-deploy.yml"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Repository 파일 불러오기
        uses: actions/checkout@v4

      - name: AWS Resource에 접근할 수 있게 AWS credentials 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}

      - name: ECR에 로그인하기
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Nginx Docker 이미지 생성
        run: docker build -t jeonggiju-nginx -f nginx/Dockerfile-nginx .

      - name: Nginx Docker 이미지에 Tag 붙이기.
        run: docker tag jeonggiju-nginx ${{steps.login-ecr.outputs.registry}}/jeonggiju/nginx:latest

      - name: ECR에 Nginx Docker 이미지 Push
        run: docker push ${{steps.login-ecr.outputs.registry}}/jeonggiju/nginx:latest

      - name: 압축하기
        run: |
          cp deploy/nginx/appspec.yml ./appspec.yml
          rm -rf ./scripts && cp -r deploy/nginx/scripts ./scripts
          cp deploy/nginx/docker-compose.nginx.yml ./docker-compose.nginx.yml
          tar -czvf $GITHUB_SHA.tar.gz \
            appspec.yml \
            scripts \
            docker-compose.nginx.yml

      - name: S3에 프로젝트 폴더 업로드하기
        run: aws s3 cp --region ap-northeast-2 ./$GITHUB_SHA.tar.gz s3://jeongiju-life/nginx/$GITHUB_SHA.tar.gz

      - name: Code Deploy를 활용해 EC2에 프로젝트 코드 배포
        run: aws deploy create-deployment
          --application-name Keep4Life-Nginx
          --deployment-config-name CodeDeployDefault.AllAtOnce
          --deployment-group-name keep-for-life-nginx-group
          --s3-location bucket=jeongiju-life,bundleType=tgz,key=nginx/$GITHUB_SHA.tar.gz

