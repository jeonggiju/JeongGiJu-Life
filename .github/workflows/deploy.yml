name: Deploy To EC2

on:
  push:
    branches:
      - production
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Repository 파일 불러오기
        uses: actions/checkout@v4
      - name: JDK 17버전 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: env 주입 및 빌드
        run: ./gradlew :spring:clean :spring:buildz
      - name: AWS Resource에 접근할 수 있게 AWS credentials 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}

      - name: .env 파일 생성
        run: |
          cat > .env << EOF
          SPRING_PROFILES_ACTIVE=${{secrets.SPRING_PROFILES_ACTVICE}}
          
          SPRING_DATASOURCE_URL=${{secrets.SPRING_DATASOURCE_URL}}
          SPRING_DATASOURCE_USERNAME=${{secrets.SPRING_DATASOURCE_USERNAME}}
          SPRING_DATASOURCE_PASSWORD=${{secrets.SPRING_DATASOURCE_PASSWORD}}
          
          JWT_ACCESS_KEY=${{secrets.JWT_ACCESS_KEY}}
          JWT_REFRESH_KEY=${{secrets.JWT_REFRESH_KEY}}
          JWT_ACCESS_TOKEN_EXPIRCATION_MS=${{secrets.JWT_ACCESS_TOKEN_EXPIRCATION_MS}}
          JWT_REFRESH_TOKEN_EXPIRCATION_MS=${{secrets.JWT_REFRESH_TOKEN_EXPIRCATION_MS}}
          
          INIT_ADMIN_EMAIL=${{secrets.INIT_ADMIN_EMAIL}}
          INIT_ADMIN_PASSWORD=${{secrets.INIT_ADMIN_PASSWORD}}
          INIT_USER_EMAIL=${{secrets.INIT_USER_EMAIL}}
          INIT_USER_PASSWORD=${{secrets.INIT_USER_PASSWORD}}
          
          APP_COOKIE_SECURE=${{secrets.APP_COOKIE_SECURE}}
          
          EOF
      - name: ECR에 로그인하기
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Spring Docker 이미지 생성
        run: docker build -t jeonggiju-life -f spring/Dockerfile-prod .

      - name: Spring Docker 이미지에 Tag 붙이기.
        run: docker tag jeonggiju-life ${{steps.login-ecr.outputs.registry}}/jeonggiju/life:latest

      - name: ECR에 Spring Docker 이미지 Push
        run: docker push ${{steps.login-ecr.outputs.registry}}/jeonggiju/life:latest

      - name: Nginx Docker 이미지 생성
        run: docker build -t jeonggiju-nginx -f nginx/Dockerfile-nginx .

      - name: Nginx Docker 이미지에 Tag 붙이기.
        run: docker tag jeonggiju-nginx ${{steps.login-ecr.outputs.registry}}/jeonggiju/nginx:latest

      - name: ECR에 Nginx Docker 이미지 Push
        run: docker push ${{steps.login-ecr.outputs.registry}}/jeonggiju/nginx:latest

      - name: 압축하기
        run: tar -czvf $GITHUB_SHA.tar.gz appspec.yml scripts docker-compose.prod.yml .env

      - name: S3에 프로젝트 폴더 업로드하기
        run: aws s3 cp --region ap-northeast-2 ./$GITHUB_SHA.tar.gz s3://jeongiju-life/$GITHUB_SHA.tar.gz

      - name: Code Deploy를 활용해 EC2에 프로젝트 코드 배포
        run: aws deploy create-deployment
          --application-name jeonggiju-life
          --deployment-config-name CodeDeployDefault.AllAtOnce
          --deployment-group-name jeonggiju-deploy-group
          --s3-location bucket=jeongiju-life,bundleType=tgz,key=$GITHUB_SHA.tar.gz
