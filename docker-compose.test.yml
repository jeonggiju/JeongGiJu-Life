version: '3.8'

services:
  # Nginx
  nginx:
    image: 624545858643.dkr.ecr.ap-northeast-2.amazonaws.com/jeonggiju/nginx:latest
    container_name: nginx-server
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - /home/ubuntu/certbot/conf:/etc/letsencrypt:ro
      - /home/ubuntu/certbot/www:/var/www/certbot:ro
    networks:
      - app-network
    depends_on:
      - app

  # Nginx Exporter
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter
    container_name: nginx-exporter
    command:
      - '-nginx.scrape-uri=http://nginx-server:80/stub_status'
    ports:
      - "9113:9113"
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - nginx

  # Spring Boot Application
  app:
    image: 624545858643.dkr.ecr.ap-northeast-2.amazonaws.com/jeonggiju/life:latest
    container_name: jeonggiju-life-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_ACCESS_KEY=${JWT_ACCESS_KEY}
      - JWT_REFRESH_KEY=${JWT_REFRESH_KEY}
      - JWT_ACCESS_TOKEN_EXPIRCATION_MS=${JWT_ACCESS_TOKEN_EXPIRCATION_MS}
      - JWT_REFRESH_TOKEN_EXPIRCATION_MS=${JWT_REFRESH_TOKEN_EXPIRCATION_MS}
      - INIT_ADMIN_EMAIL=${INIT_ADMIN_EMAIL}
      - INIT_ADMIN_PASSWORD=${INIT_ADMIN_PASSWORD}
      - INIT_USER_EMAIL=${INIT_USER_EMAIL}
      - INIT_USER_PASSWORD=${INIT_USER_PASSWORD}
      - APP_COOKIE_SECURE=${APP_COOKIE_SECURE}
      - AWS_S3_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - AWS_S3_SECRET_KEY=${AWS_S3_SECRET_KEY}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
    ports:
      - "8081:8081"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: mysql-db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MySQL Exporter
  mysql-exporter:
    image: prom/mysqld-exporter
    container_name: mysql-exporter
    command:
      - '--config.my-cnf=/etc/.my.cnf'
    volumes:
      - ./.my.cnf:/etc/.my.cnf:ro
    ports:
      - "9104:9104"
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysqldata:

networks:
  app-network:
    driver: bridge
