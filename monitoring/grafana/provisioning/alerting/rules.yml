apiVersion: 1

groups:
  - orgId: 1
    name: server-alerts
    folder: alerts
    interval: 1m
    rules:
      - uid: spring-app-down
        title: Spring App Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="spring-app"}
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        for: 1m
        annotations:
          summary: Spring application is down
          description: Spring app has been unreachable for more than 1 minute
        labels:
          severity: critical

      - uid: nginx-down
        title: Nginx Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="nginx"}
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        for: 1m
        annotations:
          summary: Nginx is down
          description: Nginx has been unreachable for more than 1 minute
        labels:
          severity: critical

      - uid: mysql-down
        title: MySQL Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="mysql"}
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
              refId: C
              type: classic_conditions
        for: 1m
        annotations:
          summary: MySQL is down
          description: MySQL has been unreachable for more than 1 minute
        labels:
          severity: critical
