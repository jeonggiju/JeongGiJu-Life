global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "spring-app"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["keep4.life:8081"]

  - job_name: "nginx"
    static_configs:
      - targets: ["keep4.life:9113"]

  - job_name: "postgres"
    static_configs:
      - targets: ["keep4.life:9187"]
