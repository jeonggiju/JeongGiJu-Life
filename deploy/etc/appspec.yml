version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/keep4life/etc
permissions:
  - object: /
    owner: ubuntu
    group: ubuntu
hooks:
  BeforeInstall:
    - location: scripts/before-etc.sh
      timeout: 60

  ApplicationStart:
    - location: scripts/start-etc.sh
      timeout: 300
      runas: ubuntu
