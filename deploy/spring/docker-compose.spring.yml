version: '3.8'

services:
  app:
    image: 624545858643.dkr.ecr.ap-northeast-2.amazonaws.com/jeonggiju/life:latest
    container_name: jeonggiju-life-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod

      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}

      - JWT_ACCESS_KEY=${JWT_ACCESS_KEY}
      - JWT_REFRESH_KEY=${JWT_REFRESH_KEY}
      - JWT_ACCESS_TOKEN_EXPIRCATION_MS=${JWT_ACCESS_TOKEN_EXPIRCATION_MS}
      - JWT_REFRESH_TOKEN_EXPIRCATION_MS=${JWT_REFRESH_TOKEN_EXPIRCATION_MS}

      - INIT_ADMIN_EMAIL=${INIT_ADMIN_EMAIL}
      - INIT_ADMIN_PASSWORD=${INIT_ADMIN_PASSWORD}
      - INIT_USER_EMAIL=${INIT_USER_EMAIL}
      - INIT_USER_PASSWORD=${INIT_USER_PASSWORD}

      - APP_COOKIE_SECURE=${APP_COOKIE_SECURE}

      - AWS_S3_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - AWS_S3_SECRET_KEY=${AWS_S3_SECRET_KEY}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
