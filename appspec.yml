version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/jeonggiju-life
permissions:
  - object: /
    owner: ubuntu
    group: ubuntu

hooks:
  BeforeInstall:
    - location: scripts/before-install.sh
      timeout: 60

  ApplicationStart:
    - location: scripts/start-server.sh
      timeout: 60
      runas: ubuntu
