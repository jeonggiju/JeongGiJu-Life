spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/appdb
    username: app
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

logging:
  level:
    root: info
    org.springframework.web: info
    org.springframework.security: off
    org.springdoc: off

storage:
  type: s3

